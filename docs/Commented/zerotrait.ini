# ============================================================================
#  ZeroARKTrait — 带注释的完整配置 / Annotated full config
#  本文件 = 「zerotrait.ini」的完整副本 + 逐项注释
#  This file is a full copy of "zerotrait.ini" with per-key notes.
#  插件会跳过以 # 或 ; 开头的行 ⇒ 可直接改这份、放进插件目录当正式配置用
#  Lines starting with # or ; are ignored by the plugin, so you may edit this
#  file and drop it in as your live config.
#  正式配置（插件目录里那份）不含任何注释 / The shipped live config has no comments.
#  Encoding: UTF-8 (no BOM).  Key names are case-sensitive and lowercase.
# ============================================================================

# 运行参数 / Runtime options — 搜索半径、分片预算、聊天查询、列表上限 / search radii, scan budget, chat query, list limits

# 按玩家名找「最近恐龙」的半径（游戏单位，5000 ≈ 半个屏幕视野）/ radius for finding the nearest dino by player name
near_radius=5000
# 按 DinoID / 名字搜索时的半径（游戏单位）/ search radius when searching by DinoID or name
id_search_radius=15000
# 每个 Tick 最多扫描多少候选 —— 防卡服的核心参数；最小 100，默认 2000 / max candidates scanned per tick; minimum 100, default 2000
scan_budget_per_tick=2000
# 是否允许玩家在聊天栏查询（只读）；0 / false = 关 / allow read-only chat queries
chat_query=true
# 聊天查询冷却（毫秒）/ chat query cooldown in milliseconds
chat_cooldown_ms=5000
# 是否开放玩家游戏内下单 `trait 买`；0 / false = 关 / allow in-game purchase requests
buy_request=1
# `trait 龙` 列龙的半径（游戏单位）/ radius for the nearby-dino list
list_radius=8000
# `trait 龙` 最多列几只 / max dinos listed
list_max=15
