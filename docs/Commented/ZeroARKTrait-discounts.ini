# 权限组折扣 / Permission-group discounts — 一行一条：权限组名=折扣百分比 / group=percent
#  组名 = 官方 Permissions 插件里的组名 / group name as defined in the official Permissions plugin
#  数值 = 百分比（10 = 打九折，0 = 不打折）/ percent (10 = 10% off, 0 = no discount)
#  多组时按 -settings.ini 的 discount_mode 计算（highest 取最大 / stack 叠加，上限 95%）/ see discount_mode
#  表里没有的组 = 折扣 0；用不到的整行删，要加组照抄一行改名 / groups not listed get 0

Default=0
Discord=0
Test=0
Admins=0
VIP1=3
VIP2=6
VIP3=10
VIP4=15
VIP5=20
VIP6=25
VIP7=30
VIP8=35
SVIP=42
SSVIP=50
