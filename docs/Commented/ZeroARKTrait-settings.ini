# ============================================================================
#  ZeroARKTrait — 带注释的完整配置 / Annotated full config
#  本文件 = 「ZeroARKTrait-settings.ini」的完整副本 + 逐项注释
#  This file is a full copy of "ZeroARKTrait-settings.ini" with per-key notes.
#  插件会跳过以 # 或 ; 开头的行 ⇒ 可直接改这份、放进插件目录当正式配置用
#  Lines starting with # or ; are ignored by the plugin, so you may edit this
#  file and drop it in as your live config.
#  正式配置（插件目录里那份）不含任何注释 / The shipped live config has no comments.
#  Encoding: UTF-8 (no BOM).  Key names are case-sensitive and lowercase.
# ============================================================================

# 商店设置 / Shop settings — 价格系数、点数来源、面板按键、折扣、语言、进服提醒 / tiers, points source, panel key, discounts, language, join tip

# 点数来源：file = 插件目录 ZeroARKTrait-points.txt（零依赖，推荐）/ db = 插件自己读 MySQL / push = 由外部（机器人、RCON）用 `Trait 缓存点数` 推 / where points come from: file (local file, no dependencies), db (plugin reads MySQL), push (pushed from outside)
points_mode=file
# 谁负责扣点：plugin = 玩家下单时插件自己扣（推荐）/ bot = 老方式（插件入队、机器人扣费发货）/ none = 不扣（测试）/ who charges: plugin (recommended), bot (legacy), none (testing)
charge_mode=plugin
# 每隔几秒把商店数据推给客户端面板；最小 1，越小越跟手 / how often shop data is pushed to the panel; minimum 1
push_seconds=2
# 1 级系数（玩家看到的「1 级」）。必须 > 0，填 0 或负数会回默认 1 / coefficient for level 1; must be > 0, otherwise falls back to 1
tier1=1
# 2 级系数，默认 1.5 / coefficient for level 2, default 1.5
tier2=1.5
# 3 级系数，默认 2 / coefficient for level 3, default 2
tier3=2
# 打开面板的按键，只有 F1~F12 可用；需要客户端 mod ZeroTraitUI（CurseForge 1704776）v11 起 / panel hotkey, F1-F12 only; requires the client mod
ui_key=F3
# 玩家在多个权限组时怎么算折扣：highest = 取最大（默认）/ stack = 叠加（上限 95%）/ how discounts combine across groups
discount_mode=highest
# 管理权限串（在官方 Permissions 插件里授给某个组即可获得管理权）/ admin permission string
perm_admin=ZeroARKTrait.admin
# 是否用官方 Permissions 判权限；0 / false / no = 关（回退到插件自带闸门）/ 0/false/no = fall back to the built-in gate
perm_use=1
# 玩家消息用哪份语言文件（ZeroARKTrait-messages-<语言码>.ini）：zh / en / 自加语言码 / which message file to load
msg_lang=zh
# 面板里词条名显示语言：auto = 跟随 msg_lang；启动时读一次，改完要重启 / trait name language in the panel; read once at startup
trait_lang=auto
# 面板总开关；0 / false / no = 不自动给玩家挂面板（聊天菜单仍可用）/ panel master switch
ui_enabled=1
# 订单总开关；0 / false / no = 拒绝 `Trait 订单`（查询、加删不受影响）/ order master switch
order_enabled=1
# 玩家进服/重连时自动提醒一条；0 或 false = 关（这个键写 no 仍算开）/ auto tip on join; 0 or false = off (the word "no" does NOT turn it off)
join_tip=1
# 提醒延迟几秒再发（等玩家加载完）；钳到 0~120 / delay in seconds, clamped to 0-120
join_tip_delay=8


# ---- 下面这段只在 points_mode=db 时才需要：把每行开头的 # 去掉并填上你的值 ----
