menu=<RichColor Color="0.55,0.85,1,1">===== 词条助手 =====</>\n1) 查我身边那只龙的词条\n2) 查订单结果（用法：trait 单 <订单号>）\n3) 词条中文名总表（全部 51 条，可滚动看）\n4) 用法说明\n5) 打开词条面板（trait 5；打 trait 5 auto 用自动关闭版）\n6) 游戏内下单：trait 买 <词条> [级别1/2/3]（服主开了才可用）\n7) 我附近的已驯服龙：trait 龙 → 再 trait 选 <序号> 选定要操作的龙\n回复格式：trait 1 / trait 2 / trait 单 ORD-001 / trait 5 / trait 买 嗜血 2 / trait 龙\n怎么用：想买词条 → 发 trait 龙 挑出你的龙（看距离/等级/名字）→ trait 选 1 选定 → trait 买 嗜血 2\n（选定后 trait 1 查的就是它；不选就按「你身边最近的那只」算）\n（机器人侧也能买：群里发 /买词条 嗜血 2 霸王龙 → /确认购买）
