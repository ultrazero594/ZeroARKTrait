menu=<RichColor Color="0.55,0.85,1,1">===== Trait Helper =====</>\n1) Check traits on the dino next to me\n2) Check order result (usage: trait order <order id>)\n3) Full trait name table (all 51, scrollable)\n4) Usage help\n5) Open the trait shop panel (trait 5; use trait 5 auto for the auto-close version)\n6) In-game ordering: trait buy <trait> [level1/2/3] (enabled by the owner)\n7) Nearby tamed dinos: trait near -> then trait select <index> to pick the target\nReply format: trait 1 / trait 2 / trait order ORD-001 / trait 5 / trait buy Vampiric 2 / trait near\nHow to use: buy a trait -> "trait near" to find your dino -> "trait select 1" -> "trait buy Vampiric 2"\n(After selecting, trait 1 checks it; otherwise the nearest dino is used)\n(You can also buy from the bot: /buy Vampiric 2 Rex -> /confirm)
